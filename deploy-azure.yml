name: EventRisk naar Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read
  id-token: write

concurrency:
  group: eventrisk-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js 24 instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Afhankelijkheden installeren
        run: npm install --no-audit --no-fund

      - name: Controles uitvoeren
        run: |
          npm run check
          npm test

      - name: Productiepakket maken
        run: |
          npm prune --omit=dev
          zip -r eventrisk-deploy.zip . \
            -x '.git/*' '.github/*' '.env' '.env.*' 'data/*' 'docs/*' 'infra/*' '*.zip'

      - name: Aanmelden bij Azure via OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Uitrollen naar Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: eventrisk-deploy.zip

      - name: Healthcheck
        env:
          APP_URL: ${{ vars.EVENTRISK_APP_URL }}
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$APP_URL/api/health"; then
              exit 0
            fi
            sleep 15
          done
          echo "De healthcheck bleef mislukken."
          exit 1
